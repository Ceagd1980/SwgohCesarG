<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar SWGOH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1424; --bg2:#0f1c33; --panel:#13233f; --panel2:#182b4d; --line:#24395f;
  --tx:#e6edf7; --tx2:#9fb0cc; --tx3:#6e809f;
  --gold:#f5b523; --blue:#2f8cff; --ls:#3ea0ff; --ds:#ff4d5a; --ok:#2ecc71; --warn:#f5a623; --bad:#e2485a;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:var(--blue)}
h1,h2,h3,.rj{font-family:Rajdhani,Inter,sans-serif;letter-spacing:.3px}
header{background:linear-gradient(180deg,#0d3a6e,#0a2a52);border-bottom:1px solid #134a86;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.logo{font:700 24px Rajdhani;color:#fff;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{color:var(--gold)}
.acc-tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.acc-tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#dfe8f6;padding:6px 12px;border-radius:8px;cursor:pointer;font:600 14px Rajdhani;display:flex;gap:6px;align-items:center}
.acc-tab small{color:var(--tx2);font:500 11px Inter}
.acc-tab.on{background:var(--gold);color:#1b1300;border-color:var(--gold)}
.acc-tab.on small{color:#4a3600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--bad)}.dot.load{background:var(--warn);animation:pul 1s infinite}
@keyframes pul{50%{opacity:.3}}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:600 13px Inter;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
nav.sec{display:flex;gap:4px;padding:0 16px;max-width:1400px;margin:0 auto;overflow-x:auto}
nav.sec button{background:none;border:0;color:#c9d6ea;padding:10px 12px;font:600 15px Rajdhani;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.sec button.on{color:#fff;border-color:var(--gold)}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:20px}
.panel h3{margin:0 0 8px;font-size:17px}
.muted{color:var(--tx2)} .small{font-size:12px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat .v{font:700 22px Rajdhani;color:#fff}.stat .l{color:var(--tx2);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input[type=text],input[type=number]{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:13px Inter}
label.chk{display:flex;gap:6px;align-items:center;color:var(--tx2);font-size:13px}
/* retratos */
.ports{display:flex;flex-wrap:wrap;gap:8px}
.p{position:relative;width:62px;text-align:center}
.p .img{width:62px;height:62px;border-radius:50%;border:3px solid var(--tx3);overflow:hidden;background:#0a1222;display:flex;align-items:center;justify-content:center;font:700 13px Rajdhani;color:var(--tx2)}
.p .img img{width:100%;height:100%;object-fit:cover;display:block}
.p.ls .img{border-color:var(--ls)} .p.ds .img{border-color:var(--ds)} .p.nt .img{border-color:#9b8cff}
.p.gl .img{box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(245,181,35,.6)}
.p.off{opacity:.28;filter:grayscale(1)}
.p.low .img{outline:2px dashed var(--warn);outline-offset:1px}
.p .badge{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#2b1d4f;border:1px solid #6b4fd8;color:#fff;font:700 11px Rajdhani;padding:0 5px;border-radius:6px;white-space:nowrap}
.p .badge.r8{background:#5a3b00;border-color:var(--gold);color:var(--gold)}
.p .badge.g{background:#1e2c45;border-color:#3d5683;color:#b7c6e0}
.p .nm{font-size:10px;color:var(--tx2);margin-top:8px;line-height:1.15;max-height:2.3em;overflow:hidden}
.p .st{font-size:9px;color:var(--gold);letter-spacing:-1px}
.p .multi{font:600 9px Inter;color:var(--tx2);margin-top:1px}
.p.sm{width:46px}.p.sm .img{width:46px;height:46px;border-width:2px}.p.sm .badge{top:32px;font-size:10px}.p.sm .nm{display:none}
details.fac{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.fac summary{cursor:pointer;padding:9px 12px;font:600 16px Rajdhani;list-style:none;display:flex;justify-content:space-between}
details.fac summary::-webkit-details-marker{display:none}
details.fac .ports{padding:4px 12px 12px}
/* equipos */
.squads{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.sq{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.sq-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.sq-h h3{margin:0;font-size:18px}
.tier{font:700 12px Rajdhani;padding:1px 7px;border-radius:5px;background:#24395f;color:#cfe0ff}
.tier.t1{background:var(--gold);color:#221700}
.chip{display:inline-block;font:600 11px Inter;padding:2px 8px;border-radius:20px}
.chip.listo{background:rgba(46,204,113,.15);color:var(--ok);border:1px solid rgba(46,204,113,.4)}
.chip.casi{background:rgba(245,166,35,.15);color:var(--warn);border:1px solid rgba(245,166,35,.4)}
.chip.falta{background:rgba(226,72,90,.12);color:#ff8090;border:1px solid rgba(226,72,90,.35)}
.accrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.accrow .an{width:120px;font:600 13px Rajdhani;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--tx2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.bar{height:8px;background:#0a1222;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.ls-t{color:var(--ls)}.ds-t{color:var(--ds)}.mx-t{color:#c3a6ff}
.note{background:#102a4a;border:1px solid #1d4b80;border-radius:8px;padding:10px 12px;color:#cfe0f5;font-size:13px}
.err-box{background:#3a1420;border:1px solid #7a2a3b;color:#ffc6cf;border-radius:8px;padding:10px 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.ctr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ctr .meta{min-width:110px}
.ctr .acc{display:flex;gap:4px;flex-wrap:wrap}
.mini{font:600 11px Rajdhani;padding:2px 6px;border-radius:5px;background:#1b2b47;color:var(--tx3)}
.mini.listo{background:rgba(46,204,113,.18);color:var(--ok)}.mini.casi{background:rgba(245,166,35,.18);color:var(--warn)}
.p .img{position:relative}
.p .img .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0}
.p .img img{position:relative;z-index:1}
.rchip{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.rchip button{background:none;border:0;color:var(--tx);padding:5px 10px;cursor:pointer;font:600 13px Rajdhani}
.rchip button small{color:var(--tx3);font:400 11px Inter}
.rchip .rv-del{color:var(--tx3);padding:5px 9px;border-left:1px solid var(--line)}
.rchip .rv-del:hover{color:var(--bad)}
.pct{font:700 18px Rajdhani;color:#fff}
tr.rv-row td{background:rgba(226,72,90,.08)}
.twmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,auto);gap:10px}
.twlab{display:flex;justify-content:space-between;font:600 13px Rajdhani;color:var(--tx3);margin-bottom:4px}
.twz{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;min-width:0}
.twz:hover{border-color:#3d5683}.twz.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.twz.fleet{background:#122844}
.twz-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}.twz-h b{font:700 20px Rajdhani}.twz-h .chip{margin-left:auto}
.twc{display:flex;flex-direction:column;align-items:center;font:600 11px Rajdhani;color:var(--tx2);max-width:64px;text-align:center}
.twsq{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
@media (max-width:760px){.twmap{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}.twz{grid-column:auto !important;grid-row:auto !important}}
footer{color:var(--tx3);font-size:12px;text-align:center;padding:20px}
@media (max-width:640px){.squads{grid-template-columns:1fr}.accrow .an{width:84px}main{padding:10px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">⚔ RADAR <b>SWGOH</b></div>
    <div class="acc-tabs" id="accTabs"></div>
    <button class="btn ghost" id="btnRefresh" title="Volver a pedir los datos a swgoh.gg">⟳ Actualizar</button>
  </div>
  <nav class="sec" id="secNav"></nav>
</header>
<main id="app"><div class="panel">Cargando…</div></main>
<footer>Datos: swgoh.gg (roster público por código de aliado; counters de swgoh.gg/gac/counters) · ROTE: genskaar.github.io · No afiliado a EA ni Lucasfilm.</footer>

<script src="equipos.js"></script>
<script>
/* ======================= ESTADO ======================= */
const S = {
  chars:{}, ships:{}, names:{}, dbErr:'',
  acc: CUENTAS.map(c=>({cfg:c, st:'load', p:null, units:new Map(), err:''})),
  sel: 0, sec: 'resumen',
  squadSize: 5, counterLead: 'SITHPALPATINE',
  roster:{fac:'*', side:'*', minR:-1, q:'', sort:'power', showLocked:false, group:true},
  plan:{mode:'gac', ndef:5, casi:false},
  rival:{code:'', st:'', err:'', p:null, units:new Map()}
};
const SECS = [['resumen','Resumen'],['roster','Roster por facción'],['equipos','Equipos'],['counters','Counters GAC'],['rival','🔍 Revisar rival'],['tw','⚔ Gremios / TW'],['plan','Plan GAC / TW'],['rote','ROTE'],['naves','Naves'],['diag','Diagnóstico']];
const META_TAGS = new Set(['Leader','Fleet Commander','Order 66 Raid','Attacker','Support','Tank','Healer']);

/* ======================= DATOS ======================= */
async function api(path){
  try{
    const r = await fetch('/.netlify/functions/swgoh?path='+encodeURIComponent(path));
    if(r.ok) return await r.json();
    let msg='Función respondió '+r.status; try{const j=await r.json(); if(j.error) msg=j.error}catch(e){}
    throw new Error(msg);
  }catch(e){
    try{ const r2 = await fetch(`https://swgoh.gg/api/${path}/`); if(r2.ok) return await r2.json(); }catch(_){}
    throw e;
  }
}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function toDB(arr){
  const out={};
  (arr||[]).forEach(u=>{
    const id=u.b||u.base_id; if(!id) return;
    out[id]={name:u.n||u.name, image:u.i||u.image, cat:u.c||u.categories||[], al:u.a||u.alignment||'', role:u.r||u.role||'', slug:u.s||((u.url||'').match(/units\/([^/]+)/)||[])[1]||''};
  });
  return out;
}
async function loadDB(force){
  const cache = lsGet('swgoh_db3');
  if(cache && !force && Date.now()-cache.t < 3*864e5 && Object.keys(cache.chars).length>100){ S.chars=cache.chars; S.ships=cache.ships; return; }
  // 1) archivos subidos al repo (characters.json / ships.json descargados de swgoh.gg)
  const local = async f => { try{ const r=await fetch(f,{cache:'no-cache'}); if(r.ok) return parseLoose(await r.text()); }catch(e){} return null; };
  let c = await local('characters.json'), s = await local('ships.json');
  S.dbSrc = c ? 'archivo characters.json del repo' : '';
  // 2) si no están, se piden a swgoh.gg
  try{
    if(!c){ c = await api('characters'); S.dbSrc='swgoh.gg en vivo'; }
    if(!s){ s = await api('ships').catch(()=>[]); }
  }catch(e){ S.dbErr=String(e.message||e); }
  const chars = toDB(c||[]);
  if(Object.keys(chars).length>100){
    S.chars=chars; S.ships=toDB(s||[]); S.dbErr='';
    lsSet('swgoh_db3',{t:Date.now(),chars:S.chars,ships:S.ships});
  } else {
    if(!S.dbErr) S.dbErr='lista de personajes incompleta';
    const manual = lsGet('swgoh_db_manual');
    if(manual){ S.chars=manual.chars; S.ships=manual.ships||{}; S.dbSrc='archivo cargado a mano'; S.dbErr=''; }
    else if(cache){ S.chars=cache.chars; S.ships=cache.ships; }
  }
}
// acepta el JSON tal cual o una página guardada que lo contiene
function parseLoose(txt){
  try{ return JSON.parse(txt); }catch(e){}
  const a=txt.indexOf('['), b=txt.lastIndexOf(']');
  if(a<0||b<a) throw new Error('no encontré la lista');
  const raw=txt.slice(a,b+1).replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  return JSON.parse(raw);
}
function loadManualFile(file, kind){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const db=toDB(parseLoose(rd.result)); if(Object.keys(db).length<10) throw new Error('lista vacía');
      const prev=lsGet('swgoh_db_manual')||{chars:{},ships:{}};
      if(kind==='ships') prev.ships=db; else prev.chars=db;
      lsSet('swgoh_db_manual',prev);
      if(kind==='ships') S.ships=db; else { S.chars=db; S.dbErr=''; S.dbSrc='archivo cargado a mano'; }
      render();
    }catch(e){ alert('Ese archivo no es la lista de swgoh.gg: '+e.message); }
  };
  rd.readAsText(file);
}
function normPlayer(p){
  const units = new Map();
  (p.units||[]).forEach(x=>{
    const u = x.data||x; const gear = u.gear_level||0;
    if(u.name) S.names[u.base_id]=u.name;
    units.set(u.base_id,{
      id:u.base_id, name:u.name, gear, stars:u.rarity||0, power:u.power||0, ct:u.combat_type||1,
      relic: gear>=13 ? Math.max(0,(u.relic_tier||2)-2) : -1,
      gl: !!u.is_galactic_legend, zetas:(u.zeta_abilities||[]).length, omis:(u.omicron_abilities||[]).length
    });
  });
  return units;
}
async function fetchPlayer(code){
  const p = await api('player/'+code);
  return {data:p.data, units:(p.units||[]).map(x=>{const u=x.data||x;return {data:{base_id:u.base_id,name:u.name,gear_level:u.gear_level,power:u.power,rarity:u.rarity,relic_tier:u.relic_tier,combat_type:u.combat_type,is_galactic_legend:u.is_galactic_legend,zeta_abilities:u.zeta_abilities||[],omicron_abilities:u.omicron_abilities||[]}}})};
}
async function loadAcc(i, force){
  const a = S.acc[i], key='swgoh_p_'+a.cfg.codigo;
  const cache = lsGet(key);
  if(cache && !force){ a.p=cache.p; a.units=normPlayer(cache.p); a.st='ok'; a.t=cache.t; }
  if(cache && !force && Date.now()-cache.t < 30*60e3) return;
  a.st = a.p ? 'ok' : 'load'; renderTabs();
  try{
    const p = await fetchPlayer(a.cfg.codigo);
    a.p=p; a.units=normPlayer(p); a.st='ok'; a.err=''; a.t=Date.now();
    lsSet(key,{t:a.t,p});
  }catch(e){ if(!a.p) a.st='err'; a.err=String(e.message||e); }
}

/* ======================= UTILIDADES ======================= */
const fmt = n => (n||0).toLocaleString('es-EC');
const fmtM = n => ((n||0)/1e6).toFixed(2)+' M';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const info = id => S.chars[id]||S.ships[id]||null;
const uname = id => info(id)?.name || S.names[id] || ABREV[id] || id;     // nombre completo
const lab = id => ABREV[id] || info(id)?.name || S.names[id] || id;         // abreviatura o nombre
function sideCls(id){const al=(info(id)?.al||'');return al.startsWith('Light')?'ls':al.startsWith('Dark')?'ds':'nt'}
function initials(id){return lab(id).replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).map(w=>w[0]).join('').slice(0,3)||'?'}
function portrait(id, u, o={}){
  const im = info(id)?.image;
  const cls = ['p',sideCls(id), o.sm?'sm':'', (u?.gl||o.gl)?'gl':'', (!u&&!o.free)?'off':'', (u&&o.min!=null&&u.relic<o.min)?'low':''].join(' ');
  let badge='';
  if(u){ badge = u.relic>=0 ? `<span class="badge ${u.relic>=8?'r8':''}">R${u.relic}</span>` : (u.ct===2?`<span class="badge g">${u.stars}★</span>`:`<span class="badge g">G${u.gear}</span>`); }
  const tip = esc(uname(id)) + (u?` · ${u.stars}★ · ${u.relic>=0?'R'+u.relic:'G'+u.gear} · ${fmt(u.power)} PG${u.zetas?` · ${u.zetas}Z`:''}${u.omis?` · ${u.omis}Ω`:''}`:(o.free?'':' · no lo tienes'));
  return `<div class="${cls}" title="${tip}"><div class="img">${im?`<img loading="lazy" src="${im}" alt="" onerror="this.remove()">`:''}<span class="ini">${esc(initials(id))}</span></div>${badge}${o.multi?`<div class="multi">${o.multi}</div>`:''}<div class="nm">${esc(lab(id))}</div></div>`;
}
const accs = () => S.sel==='all' ? S.acc.filter(a=>a.p) : [S.acc[S.sel]].filter(a=>a.p);
function relicCount(a,min,ct=1){let n=0;a.units.forEach(u=>{if(u.ct===ct&&u.relic>=min)n++});return n}
const glCount = a => [...a.units.values()].filter(u=>u.gl).length;

function evalSquad(sq, a, size=S.squadSize){
  const U = id => a.units.get(id);
  const core = sq.core.slice(0,size);
  const missing = core.filter(id=>!U(id) || (U(id).stars<7 && !U(id).gl));
  const need = Math.max(0, size-core.length);
  const flexOwned = sq.flex.filter(id=>U(id)).sort((x,y)=>(U(y).relic-U(x).relic)||(U(y).power-U(x).power));
  const pick = flexOwned.slice(0,need);
  const ids = [...core, ...pick];
  const low = ids.filter(id=>U(id) && U(id).relic < sq.relic);
  const complete = sq.flex.length===0 || pick.length>=need;
  const estado = missing.length ? 'falta' : (low.length===0 && complete ? 'listo' : 'casi');
  const power = ids.reduce((s,id)=>s+(U(id)?.power||0),0);
  return {estado, ids, missing, low, power, need:sq.flex.length?Math.max(0,need-pick.length):0};
}
function evalIds(ids, a, min=7){
  const U=id=>a.units.get(id);
  if(ids.some(id=>!U(id))) return 'falta';
  return ids.every(id=>U(id).relic>=min) ? 'listo' : 'casi';
}
const chipTxt = {listo:'Listo',casi:'Casi',falta:'No disponible'};

/* Counters importados por el usuario (páginas de swgoh.gg guardadas) y counters.json del repo */
S.ctrRepo = {};
function ctrImported(){ return lsGet('swgoh_ctr_import')||{}; }
function ctrSource(lead){
  const imp=ctrImported()[lead]; if(imp&&imp.rows?.length) return {rows:imp.rows,src:`importado de swgoh.gg el ${new Date(imp.t).toLocaleDateString('es-EC')}${imp.season?' · '+imp.season:''}`};
  const rep=S.ctrRepo[lead]; if(rep&&rep.rows?.length) return {rows:rep.rows,src:`counters.json del repo${rep.season?' · '+rep.season:''}`};
  return {rows:null,src:COUNTERS_FUENTE};
}
function countersFor(lead){
  const s=ctrSource(lead);
  if(s.rows) return s.rows.slice().sort((x,y)=>(y.win-x.win)||(y.seen-x.seen));
  const map=new Map();
  (COUNTERS_BASE[lead]||[]).forEach(s=>{
    const [squad,seen,win]=s.split('|'); const ids=squad.split(',').map(x=>x.trim()).filter(Boolean);
    const k=ids.join(','), row={ids,seen:+seen||0,win:+win||0};
    const prev=map.get(k); if(!prev||row.seen>prev.seen) map.set(k,row);
  });
  return [...map.values()].sort((x,y)=>(y.win-x.win)||(y.seen-x.seen));
}
/* Lee una página de counters de swgoh.gg guardada con Ctrl+S */
function parseCountersPage(html){
  const lead = (html.match(/gac\/counters\/([A-Z0-9_]+)\/?["?]/)||html.match(/d_lead=([A-Z0-9_]+)/)||[])[1];
  const sm = html.replace(/<[^>]+>/g,' ').match(/Season\s*(\d+)\s*-\s*(5v5|3v3)/i);
  const season = sm ? `Temporada ${sm[1]} · ${sm[2]}` : '';
  const parts = html.split(/[?&](?:amp;)?a_lead=/).slice(1);
  const map=new Map(); let acc=null;
  for(const part of parts){
    const ld=(part.match(/^([A-Z0-9_]+)/)||[])[1]; if(!ld) continue;
    const cut = part.split(/[?&](?:amp;)?d_member=/)[0];
    const mem=[...cut.matchAll(/[?&](?:amp;)?a_member=([A-Z0-9_]+)/g)].map(m=>m[1]);
    if(!acc || acc.lead!==ld) acc={lead:ld,mem:new Set()};
    mem.forEach(m=>acc.mem.add(m));
    const text=part.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
    const seen=+((text.match(/Seen\s*([\d.,]+\s*K?)/i)||[])[1]||'0').replace(/,/g,'').replace(/\s*K$/i,'000').replace(/\.(\d)000$/,'$100');
    const win=+((text.match(/Win\s*%\s*([\d.]+)/i)||[])[1]||0);
    if(!seen) continue;
    const ids=[acc.lead,...[...acc.mem].filter(m=>m!==acc.lead)];
    const k=ids[0]+'|'+ids.slice(1).sort().join(',');
    const prev=map.get(k);
    if(prev){ const t=prev.seen+seen; prev.win=Math.round((prev.win*prev.seen+win*seen)/t); prev.seen=t; }
    else map.set(k,{ids,seen,win});
    acc=null;
  }
  return {lead, season, rows:[...map.values()]};
}
function importCounterFiles(files){
  const out=[]; let pending=files.length; if(!pending) return;
  [...files].forEach(f=>{
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const r=parseCountersPage(rd.result);
        if(r.lead && r.rows.length){ const all=ctrImported(); all[r.lead]={t:Date.now(),season:r.season,rows:r.rows}; lsSet('swgoh_ctr_import',all); out.push(`✔ ${lab(r.lead)}: ${r.rows.length} equipos`); S.counterLead=r.lead; }
        else out.push(`✘ ${f.name}: no encontré counters (¿guardaste la página completa?)`);
      }catch(e){ out.push(`✘ ${f.name}: ${e.message}`); }
      if(--pending===0){ S.importMsg=out.join(' · '); render(); }
    };
    rd.readAsText(f);
  });
}

function vRoster(list){

  const allFac=new Set(); Object.values(S.chars).forEach(c=>c.cat.forEach(t=>{if(!META_TAGS.has(t))allFac.add(t)}));

  const pool = hasDB ? Object.keys(S.chars) : [...new Set(list.flatMap(a=>[...a.units.values()].filter(u=>u.ct===1).map(u=>u.id)))];
  const ids = pool.filter(id=>{
    const c=S.chars[id]||{cat:[],al:''};
    if(R.side!=='*' && !c.al.startsWith(R.side)) return false;

    if(R.q){const q=R.q.toLowerCase(); if(!uname(id).toLowerCase().includes(q) && !lab(id).toLowerCase().includes(q)) return false;}

    if(R.minR>=0 && !list.some(a=>(a.units.get(id)?.relic??-1)>=R.minR)) return false;
    return true;
  });
  const best = id => list.reduce((b,a)=>{const u=a.units.get(id);return u&&(!b||u.relic>b.relic||(u.relic===b.relic&&u.power>b.power))?u:b},null);
  const sorter = {power:(x,y)=>(best(y)?.power||0)-(best(x)?.power||0), relic:(x,y)=>((best(y)?.relic??-9)-(best(x)?.relic??-9))||((best(y)?.power||0)-(best(x)?.power||0)), name:(x,y)=>lab(x).localeCompare(lab(y))}[R.sort];
  const card = id => S.sel==='all'

  let body;

  } else body = `<div class="ports">${ids.sort(sorter).map(card).join('')}</div>`;
  return `<div class="panel"><h2>Roster por facción ${S.sel==='all'?'<span class="small muted">· debajo de cada retrato: nivel en cada cuenta ('+list.map(a=>esc(a.cfg.nombre)).join(' · ')+')</span>':''}</h2>

/* ======================= PLAN ======================= */
function planFor(a){
  const P=S.plan, ok = st => st==='listo' || (P.casi && st==='casi');
  const cand = EQUIPOS.map(sq=>({sq,e:evalSquad(sq,a)})).filter(x=>ok(x.e.estado));
  const used=new Set(), def=[], off=[];
  const free = x => x.e.ids.every(id=>!used.has(id));
  const take = (x,arr)=>{x.e.ids.forEach(id=>used.add(id));arr.push(x)};
  cand.slice().sort((x,y)=>(y.sq.def-x.sq.def)||(x.sq.tier-y.sq.tier)||(y.e.power-x.e.power)).forEach(x=>{ if(def.length<P.ndef && x.sq.def && free(x)) take(x,def) });
  cand.slice().sort((x,y)=>(x.sq.tier-y.sq.tier)||(y.e.power-x.e.power)).forEach(x=>{ if(def.length<P.ndef && free(x)) take(x,def) });
  cand.slice().sort((x,y)=>(x.sq.tier-y.sq.tier)||(y.e.power-x.e.power)).forEach(x=>{ if(free(x)) take(x,off) });
  return {def,off};
}

/* ---------- datos compactos de cada miembro ---------- */
function compactPlayer(p){
  const d=p.data||{}, u=[];
  (p.units||[]).forEach(x=>{ const v=x.data||x; const g=v.gear_level||0, ct=v.combat_type||1;
    if(ct===1 && g<12 && !v.is_galactic_legend) return;
    if(ct===2 && (v.rarity||0)<5) return;
    u.push([v.base_id, g>=13?Math.max(0,(v.relic_tier||2)-2):-1, g, v.rarity||0, v.power||0, v.is_galactic_legend?1:0, ct]);
  });
  return { n:d.name||'', c:String(d.ally_code||''), gp:d.galactic_power||0, u };
}
function memberUnits(m){
  if(m._u) return m._u;
  const map=new Map(); (m.u||[]).forEach(([id,relic,gear,stars,power,gl,ct])=>map.set(id,{id,relic,gear,stars,power,gl:!!gl,ct,zetas:0,omis:0}));
  Object.defineProperty(m,'_u',{value:map,enumerable:false}); return map;
}
function parseAny(txt){
  try{ return JSON.parse(txt); }catch(e){}
  const pre = txt.match(/<pre[^>]*>([\s\S]*?)<\/pre>/i);
  const raw = (pre?pre[1]:txt).replace(/<[^>]+>/g,'').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  const a=raw.indexOf('{'), b=raw.lastIndexOf('}'); if(a<0||b<a) throw new Error('no encontré datos');
  return JSON.parse(raw.slice(a,b+1));
}
function slimGuildInfo(j){
  const d=j.data||j;
  return { guild_id:d.guild_id, name:d.name, galactic_power:d.galactic_power, member_count:d.member_count,
    members:(d.members||[]).filter(m=>m.ally_code).map(m=>({ally_code:String(m.ally_code), player_name:m.player_name, galactic_power:m.galactic_power, league_name:m.league_name, member_level:m.member_level, last_activity_time:m.last_activity_time})) };
}

/* ---------- carga del gremio ---------- */
async function loadGuild(gid, force){
  const G = S.tw.guilds[gid] = S.tw.guilds[gid] || {st:'', members:{}, err:''};
  const cache = lsGet('swgoh_g_'+gid);
  if(cache && !force && !G.info){ G.info=cache.info; G.members=cache.members||{}; G.t=cache.t; G.st='ok'; }
  if(cache && !force && Date.now()-cache.t < 12*3600e3 && Object.keys(G.members).length>=(G.info?.members?.length||1)) { if(S.sec==='tw') render(); return; }
  if(G.st==='load') return;
  G.st='load'; G.err=''; G.done=0; if(S.sec==='tw') render();
  // 1) datos del gremio
  try{
    let info=null;
    try{ info = slimGuildInfo(await api('guild-profile/'+gid)); }catch(e){
      const r = await fetch(`gremio_${gid}.json`,{cache:'no-cache'}).catch(()=>null);
      if(r && r.ok) info = slimGuildInfo(parseAny(await r.text())); else throw e;
    }
    if(!info.members.length) throw new Error('el gremio llegó sin miembros');
    G.info = info;
  }catch(e){ G.err=String(e.message||e); if(!G.info && cache?.info){ G.info=cache.info; if(!Object.keys(G.members||{}).length) G.members=cache.members||{}; } if(!G.info){ G.st='err'; if(S.sec==='tw') render(); return; } }
  // 2) roster de cada miembro (de 3 en 3 para no saturar swgoh.gg)
  const list = G.info.members, mineByCode = {};
  S.acc.forEach(a=>{ if(a.p) mineByCode[a.cfg.codigo]=a; });
  const fresh = {};
  let i=0, lastR=0; G.done=0; G.fail=[];
  const worker = async ()=>{
    while(i<list.length){
      const m=list[i++];
      try{
        let p = mineByCode[m.ally_code]?.p;
        if(!p){ try{ p = await fetchPlayer(m.ally_code); }catch(e){ await new Promise(r=>setTimeout(r,1500)); p = await fetchPlayer(m.ally_code); } }
        fresh[m.ally_code] = compactPlayer(p);
      }catch(e){ if(G.members[m.ally_code]) fresh[m.ally_code]=G.members[m.ally_code]; else G.fail.push(m.player_name||m.ally_code); }
      G.done++;
      if(S.sec==='tw' && Date.now()-lastR>900){ lastR=Date.now(); render(); }
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  G.members = fresh; G.t=Date.now(); G.st='ok';
  lsSet('swgoh_g_'+gid,{t:G.t,info:G.info,members:G.members});
  if(S.sec==='tw') render();
}

function twTemplates(){
  const key = Object.keys(S.chars).length+'|'+EQUIPOS.length+'|'+TW_META.length;
  if(_twT && _twTkey===key) return _twT;
  const byName={}, bySlug={};
  Object.entries(S.chars).forEach(([id,c])=>{ const k=slugify(c.name); if(!byName[k]) byName[k]=id; if(c.slug) bySlug[c.slug]=id; });
  const res = n => byName[slugify(n)] || bySlug[slugify(n)] || (S.chars[n]?n:null);
  const groups={}, unresolved=new Set();
  const G = lead => groups[lead] = groups[lead] || {lead, variants:[], flex:null, hold:null, tier:null, est:true, nombre:null};
  TW_META.forEach(m=>{
    const ids=m.e.map(n=>{ const id=res(n); if(!id) unresolved.add(n); return id; });
    if(!ids[0]) return;
    const g=G(ids[0]);
    if(ids.every(Boolean)) g.variants.push({ids, hold:m.hold});
    if(g.hold==null || m.hold>g.hold){ g.hold=m.hold; g.tier=m.t; }
    g.est=false;
  });
  const atk={}; Object.entries(window.TW_ATAQUE||{}).forEach(([n,v])=>{ const id=res(n); if(id) atk[id]=v; else unresolved.add(n); });
  EQUIPOS.forEach(sq=>{ const g=G(sq.lider); g.flex=sq; g.nombre=g.nombre||sq.nombre; });
  const tierEst={1:14,2:11,3:8,4:6,5:5};
  Object.values(groups).forEach(g=>{
    if(g.hold==null) g.hold = tierEst[g.flex?.tier]||6;
    g.nombre = g.nombre || lab(g.lead);
    g.atk = atk[g.lead]||null;
  });
  _twT={groups, unresolved:[...unresolved], atk}; _twTkey=key; return _twT;
}
function squadStats(ids,U){ let r=0,p=0,gl=false; ids.forEach(id=>{const u=U.get(id); r+=Math.max(0,u.relic); p+=u.power; if(u.gl) gl=true;}); return {avgR:r/ids.length, power:p, gl}; }
function memberSquads(U, relicMin){
  const out=[];
  Object.values(twTemplates().groups).forEach(g=>{
    const L=U.get(g.lead); if(!L || L.ct!==1 || (L.stars<7 && !L.gl)) return;
    const cands=[];
    g.variants.forEach(v=>{ if(v.ids.every(id=>U.has(id))) cands.push({ids:v.ids, meta:true}); });
    if(g.flex){
      const core=g.flex.core.filter(id=>U.has(id));
      if(core.length===g.flex.core.length){
        const flex=g.flex.flex.filter(id=>U.has(id) && !core.includes(id)).sort((a,b)=>(U.get(b).relic-U.get(a).relic)||(U.get(b).power-U.get(a).power));
        const ids=[...core,...flex].slice(0,5);
        if(ids.length>=5 || (g.flex.flex.length===0 && ids.length===g.flex.core.length)) cands.push({ids, meta:false});
      }
    }
    let best=null;
    cands.forEach(c=>{
      const st=squadStats(c.ids,U), ok=c.ids.every(id=>U.get(id).relic>=relicMin);
      const rank=(ok?1000:0)+(c.meta?50:0)+st.avgR;
      if(!best || rank>best.rank) best={...c,...st,ok,rank};
    });
    if(!best) return;
    const score = g.hold*(0.55+0.45*Math.min(best.avgR,9)/9);
    out.push({lead:g.lead, nombre:g.nombre, hold:g.hold, est:g.est, tier:g.tier, atk:g.atk, ids:best.ids, avgR:best.avgR, power:best.power, gl:best.gl, ok:best.ok, meta:best.meta, score});
  });
  return out.sort((a,b)=>b.score-a.score);
}

/* ---------- plan de TW ---------- */
function twReserved(sq,O){ return (O.reserve==='gl' && sq.gl) || (O.reserve==='atk' && sq.atk && sq.atk[0]==='S'); }
function twPlan(G){
  const O=S.tw.opts, members=Object.values(G.members||{});
  const pool=[], perMember={}, stats={};
  members.forEach(m=>{
    const U=memberUnits(m), all=memberSquads(U,O.relic);
    all.forEach(s=>{ const st=stats[s.lead]=stats[s.lead]||{lead:s.lead,nombre:s.nombre,hold:s.hold,est:s.est,tier:s.tier,atk:s.atk,ok:0,casi:0,relSum:0,gl:s.gl,placed:0,zones:{},reserved:false}; if(s.ok){st.ok++;st.relSum+=s.avgR;} else st.casi++; if(s.gl) st.gl=true; });
    const used=new Set(), picked=[];
    all.filter(s=>s.ok).forEach(s=>{
      if(twReserved(s,O)){ stats[s.lead].reserved=true; return; }
      if(picked.length<O.perMember && s.ids.every(id=>!used.has(id))){ s.ids.forEach(id=>used.add(id)); picked.push({...s, member:m.n, code:m.c}); }
    });
    perMember[m.c]=picked; pool.push(...picked);
  });
  // grupos por líder: cada territorio lleva pocos tipos de equipo, apilados
  const groups={}; pool.forEach(s=>{ (groups[s.lead]=groups[s.lead]||{lead:s.lead,gl:s.gl,hold:s.hold,copies:[]}).copies.push(s); if(s.gl) groups[s.lead].gl=true; });
  Object.values(groups).forEach(g=>g.copies.sort((a,b)=>b.score-a.score));
  const zones=TW_MAPA.filter(z=>z.tipo==='pj').map(z=>({...z, list:[], extra:false}));
  const maxT=O.maxTypes>0?O.maxTypes:99;
  const room=z=>O.slots-z.list.length, types=z=>new Set(z.list.map(s=>s.lead)).size;
  const move=(z,g,n)=>{ g.copies.splice(0,n).forEach(s=>{s.zone=z.id; z.list.push(s);}); };
  const pickGroup=(z,ranked)=>{
    const avail=ranked.filter(g=>g.copies.length && !z.list.some(s=>s.lead===g.lead)); if(!avail.length) return null;
    // se respeta el orden de prioridad; solo entre equipos de dureza parecida se prefiere el que más copias tiene
    const best=avail[0], win=avail.filter(g=>g.gl===best.gl && g.hold>=best.hold-6);
    const need=Math.ceil(room(z)/Math.max(1,maxT-types(z)));
    return win.find(g=>g.copies.length>=need) || win.find(g=>g.copies.length>=need/2) || best;
  };
  const fillZone=(z,ranked)=>{ while(room(z)>0 && types(z)<maxT){ const g=pickGroup(z,ranked); if(!g) break; move(z,g,Math.min(room(z),g.copies.length)); } };
  const G_=()=>Object.values(groups);
  const byHold=(a,b)=>(b.hold-a.hold)||(b.copies.length-a.copies.length);
  const glFirst=(a,b)=>(b.gl-a.gl)||byHold(a,b);
  const zc=c=>zones.filter(z=>z.col===c), cols=[...new Set(zones.map(z=>z.col))].sort((a,b)=>a-b);
  if(O.strat==='gl'){
    zones.slice().sort((a,b)=>a.col-b.col||a.fila-b.fila).forEach(z=>fillZone(z,G_().sort(glFirst)));
  } else if(O.strat==='trampa'){
    const first=cols[0], last=cols[cols.length-1];
    zc(first).forEach(z=>fillZone(z,G_().filter(g=>!g.gl).sort(byHold)));
    zc(last).forEach(z=>fillZone(z,G_().sort(glFirst)));
    cols.slice(1,-1).forEach(c=>zc(c).forEach(z=>fillZone(z,G_().sort(byHold))));
    zc(first).forEach(z=>fillZone(z,G_().sort(byHold)));
  } else {
    for(let r=0;r<maxT;r++) zones.slice().sort((a,b)=>a.col-b.col||a.fila-b.fila).forEach(z=>{ if(room(z)>0 && types(z)<maxT){ const g=pickGroup(z,G_().sort(byHold)); if(g) move(z,g,Math.min(room(z),Math.ceil(O.slots/maxT),g.copies.length)); } });
    zones.forEach(z=>fillZone(z,G_().sort(byHold)));
  }
  if(O.fill) G_().filter(g=>g.copies.length).sort(byHold).forEach(g=>{
    while(g.copies.length){
      const open=zones.filter(z=>room(z)>0); if(!open.length) return;
      const z=open.find(z=>z.list.some(s=>s.lead===g.lead)) || open.sort((a,b)=>(a.list.length/O.slots-b.list.length/O.slots)||a.col-b.col)[0];
      if(!z.list.some(s=>s.lead===g.lead)) z.extra=true;
      move(z,g,Math.min(room(z),g.copies.length));
    }
  });
  const rest=G_().flatMap(g=>g.copies);
  zones.forEach(z=>z.list.forEach(s=>{ const st=stats[s.lead]; st.placed++; st.zones[z.id]=(st.zones[z.id]||0)+1; }));
  // flota
  const fz=TW_MAPA.filter(z=>z.tipo==='nave').map(z=>({...z,list:[]})).sort((a,b)=>a.col-b.col);
  const fleets=members.map(m=>{
    const U=memberUnits(m), ships=[...U.values()].filter(u=>u.ct===2);
    const caps=ships.filter(u=>/^CAPITAL/.test(u.id) || (S.ships[u.id]?.cat||[]).some(c=>/capital/i.test(c)) || /capital/i.test(S.ships[u.id]?.role||'')).sort((a,b)=>b.power-a.power);
    if(!caps.length) return null;
    const rest7=ships.filter(u=>u.id!==caps[0].id).sort((a,b)=>b.power-a.power).slice(0,7);
    if(rest7.length<3) return null;
    return {member:m.n, code:m.c, cap:caps[0].id, ids:[caps[0].id,...rest7.map(u=>u.id)], power:caps[0].power+rest7.reduce((s,u)=>s+u.power,0)};
  }).filter(Boolean).sort((a,b)=>b.power-a.power);
  fleets.forEach(f=>{ const z=fz.find(z=>z.list.length<O.fleetSlots); if(z){ z.list.push(f); f.zone=z.id; } });
  return {zones, fleetZones:fz, fleets, pool, rest, perMember, stats:Object.values(stats), members};
}

  return `<div class="panel"><h2>Equipos que puede armar el gremio</h2>
  <p class="small muted"><b>Tier def. / Hold</b> = tier list de defensa y % de defensas que aguantan; <b>Tier ataque</b> = tier list de ataque y % de victorias atacando (${esc(TW_FUENTE)}). * = estimado. <b>Listos</b> = miembros que la tienen completa a R${S.tw.opts.relic}+. <b>Counters con GL</b> = de sus mejores counters, cuántos necesitan una Leyenda: cuanto más alto, más caro le sale al rival.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Equipo</th><th class="n">Tier def.</th><th class="n">Hold</th><th class="n">Tier ataque</th><th>Mejor para</th><th class="n">Listos</th><th class="n">Bajos</th><th class="n">Reliq. media</th><th class="n">Counters con GL</th><th class="n">Colocados</th><th>Dónde</th></tr></thead><tbody>
  ${rows.map(s=>{const need=ctrNeedGL(s.lead);return `<tr><td><div class="row">${portrait(s.lead,null,{sm:true,free:true,gl:s.gl})}<span><b>${esc(s.nombre)}</b>${s.gl?' <span class="chip casi">GL</span>':''}</span></div></td>
  <td class="n">${s.tier||'–'}</td><td class="n"><b class="pct" style="color:${s.hold>=20?'var(--ok)':s.hold>=12?'#fff':'var(--tx3)'}">${s.hold}%</b>${s.est?'*':''}</td>
  <td class="n">${s.atk?`${s.atk[0]} · ${s.atk[1]}%`:'–'}</td><td>${twRole(s)}</td><td class="n">${s.ok}</td><td class="n muted">${s.casi}</td><td class="n">${s.ok?'R'+(s.relSum/s.ok).toFixed(1):'–'}</td>
  <td class="n">${need==null?'<span class="muted">–</span>':need+'%'}</td><td class="n">${s.placed}</td><td class="small">${Object.entries(s.zones).sort((a,b)=>a[0].localeCompare(b[0])).map(([z,n])=>`${z}×${n}`).join(' ')}</td></tr>`}).join('')}
  </tbody></table></div></div>`;
}
function twRole(s){
  const atkS = s.atk && (s.atk[0]==='S' || (s.atk[0]==='A' && s.atk[1]>=85));
  if(s.reserved) return '<span class="chip casi">⚔ guardado</span>';
  if(s.hold>=20 && !atkS) return '<span class="chip listo">🛡 Defensa</span>';
  if(atkS && s.hold<25) return '<span class="chip casi">⚔ Ataque</span>';
  if(s.hold>=20) return '<span class="chip listo">🛡 / ⚔ ambos</span>';
  if(s.hold<11) return '<span class="chip falta">⚔ Ataque</span>';
  return '<span class="muted small">relleno</span>';
}
function twMiembros(P){
  const q=S.tw.q.toLowerCase(), mine=new Set(CUENTAS.map(c=>c.codigo));
  const ms=P.members.slice().sort((a,b)=>(mine.has(b.c)-mine.has(a.c))||b.gp-a.gp).filter(m=>!q||m.n.toLowerCase().includes(q));
  const fleetBy={}; P.fleets.forEach(f=>{ if(f.zone) fleetBy[f.code]=f; });
  return `<div class="panel"><h2>Qué pone cada miembro</h2><div class="ctrl"><input type="text" id="twQ" placeholder="Buscar miembro…" value="${esc(S.tw.q)}"></div>
  ${ms.map(m=>{const U=memberUnits(m), sq=P.perMember[m.c]||[], f=fleetBy[m.c];
    return `<div class="accrow" style="align-items:flex-start;flex-wrap:wrap"><span class="an" style="width:150px">${mine.has(m.c)?'⭐ ':''}${esc(m.n)}<br><span class="small muted">${fmtM(m.gp)} · ${sq.length} def.</span></span>
    <div style="flex:1;display:flex;flex-wrap:wrap;gap:10px">${sq.map(s=>`<div class="twsq"><span class="chip ${s.zone?'listo':''}">${s.zone||'reserva'}</span><div class="ports">${s.ids.map(id=>portrait(id,U.get(id),{sm:true,min:S.tw.opts.relic})).join('')}</div></div>`).join('')||'<span class="small muted">Sin equipos a la reliquia mínima.</span>'}
    ${f?`<div class="twsq"><span class="chip listo">${f.zone}</span><div class="ports">${f.ids.slice(0,4).map(id=>portrait(id,U.get(id),{sm:true})).join('')}</div></div>`:''}</div></div>`}).join('')}</div>`;
}
function twIdeas(P){
  const O=S.tw.opts;
  const st=P.stats.filter(s=>s.ok>0);
  const trap=st.filter(s=>!s.gl && s.ok>=3).sort((a,b)=>b.hold-a.hold||b.ok-a.ok).slice(0,6);
  const gls=st.filter(s=>s.gl).sort((a,b)=>b.hold-a.hold);
  const weak=st.filter(s=>!s.gl && s.hold<10 && s.ok>=5).sort((a,b)=>a.hold-b.hold).slice(0,5);
  const front=P.zones.filter(z=>z.col===1);
  const li=s=>`<li><b>${esc(s.nombre)}</b> · hold ${s.hold}%${s.est?'*':''} · ${s.ok} miembros listos${ctrNeedGL(s.lead)!=null?` · ${ctrNeedGL(s.lead)}% de sus counters usan GL`:''}</li>`;
  return `<div class="cols">
   <div class="panel"><h3>🛡 Candidatas para el frente (sin GL)</h3><p class="small muted">Las defensas más duras que el gremio tiene repetidas. Puestas en bloque en T1/B1 obligan al rival a tener muchos counters del mismo tipo.</p><ul class="small">${trap.map(li).join('')||'<li class="muted">Ninguna con 3+ copias.</li>'}</ul></div>
   <div class="panel"><h3>👑 Sus Leyendas Galácticas</h3><p class="small muted">Según la tier list de defensa: SLKR aguanta ~42%, Rey GL ~38% y Leia GL ~28%, pero LV 22%, Ahsoka GL 19% y Hondo GL 16%. Varias GL aguantan menos que Stranger (40%), Bastila/JML (28%), Rotta (27%) o Cere (26%), y además son las mejores para atacar: ponerlas todas al frente gasta tu ataque.</p><ul class="small">${gls.map(li).join('')||'<li class="muted">Sin GL listas.</li>'}</ul></div>
   <div class="panel"><h3>⚔ Mejor para atacar que para defender</h3><p class="small muted">Tier alto en ataque y poco hold en defensa: guárdalos para conquistar.</p><ul class="small">${st.filter(s=>s.atk && (s.atk[0]==='S'||s.atk[0]==='A') && s.hold<20).sort((a,b)=>b.atk[1]-a.atk[1]).slice(0,6).map(s=>`<li><b>${esc(s.nombre)}</b> · ataque ${s.atk[0]} (${s.atk[1]}%) · defensa ${s.hold}% · ${s.ok} listos</li>`).join('')||'<li class="muted">—</li>'}</ul>
   <p class="small muted">Y estos casi nunca aguantan en defensa:</p><ul class="small">${weak.map(li).join('')||'<li class="muted">—</li>'}</ul></div>
   <div class="panel"><h3>📌 Cómo queda el frente ahora</h3><ul class="small">${front.map(z=>`<li><b>${z.id}</b>: ${z.list.length}/${O.slots} equipos · dureza media ${zoneHold(z)}% · ${z.list.filter(s=>s.gl).length} GL</li>`).join('')}</ul>
   <p class="small muted">Prueba cambiar la estrategia arriba y compara la dureza media del frente. Los porcentajes son de GAC 5v5: en TW el rival ataca con todo su roster, así que tómalos como guía, no como dato exacto.</p></div></div>`;
}
function twCopyText(P){
  const lines=[`TW · ${S.tw.guilds[S.tw.gid]?.info?.name||''} · estrategia: ${{gl:'GL al frente',trampa:'trampas al frente',equil:'equilibrado'}[S.tw.opts.strat]}`]; P.zones.forEach(z=>{ const g={}; z.list.forEach(s=>g[s.lead]=(g[s.lead]||0)+1); lines.push(`${z.id}: `+Object.entries(g).map(([l,n])=>`${lab(l)} ×${n}`).join(', ')); }); lines.push('');
  P.members.slice().sort((a,b)=>a.n.localeCompare(b.n)).forEach(m=>{
    const sq=(P.perMember[m.c]||[]).filter(s=>s.zone); const f=P.fleets.find(f=>f.code===m.c && f.zone);
    if(!sq.length && !f) return;
    lines.push(`• ${m.n}: `+sq.map(s=>`${s.zone} ${lab(s.lead)}`).join(' | ')+(f?` | ${f.zone} flota ${lab(f.cap)}`:''));
  });
  return lines.join('\n');
}

/* ======================= EVENTOS ======================= */
function bind(){
  const $=id=>document.getElementById(id), on=(id,ev,f)=>{const e=$(id);if(e)e.addEventListener(ev,f)};
  const R=S.roster;
  on('rFac','change',e=>{R.fac=e.target.value;render()});
  on('rSide','change',e=>{R.side=e.target.value;render()});
  on('rMin','change',e=>{R.minR=+e.target.value;render()});
  on('rSort','change',e=>{R.sort=e.target.value;render()});
  on('rGroup','change',e=>{R.group=e.target.checked;render()});
  on('rLocked','change',e=>{R.showLocked=e.target.checked;render()});
  on('rQ','change',e=>{R.q=e.target.value;render()});
  on('sqSize','change',e=>{S.squadSize=+e.target.value;render()});
  on('sqSize2','change',e=>{S.squadSize=+e.target.value;render()});
  on('onlyReady','change',e=>{S.onlyReady=e.target.checked;render()});
  on('cLead','change',e=>{S.counterLead=e.target.value;render()});
  on('cOther','change',e=>{const v=e.target.value.trim().toLowerCase();const hit=Object.entries(S.chars).find(([id,c])=>c.name.toLowerCase()===v||id.toLowerCase()===v)||Object.entries(ABREV).map(([id,ab])=>[id,{name:ab}]).find(([id,c])=>c.name.toLowerCase()===v);if(hit){S.counterLead=hit[0];render()}});
  on('pMode','change',e=>{S.plan.mode=e.target.value;S.plan.ndef=e.target.value==='gac'?5:10;render()});
  on('pDef','change',e=>{S.plan.ndef=Math.max(1,+e.target.value||1);render()});
  on('pCasi','change',e=>{S.plan.casi=e.target.checked;render()});
  on('rvGo','click',()=>loadRival($('rvCode').value));
  on('fCtr','change',e=>importCounterFiles(e.target.files));
  on('dlCtr','click',downloadCountersJSON);
  document.querySelectorAll('.ctr-go').forEach(a=>a.onclick=e=>{e.preventDefault();S.counterLead=a.dataset.l;render()});
  on('goDiag','click',e=>{e.preventDefault();S.sec='diag';renderTabs();render()});
  on('fChars','change',e=>{if(e.target.files[0])loadManualFile(e.target.files[0],'chars')});
  on('fShips','change',e=>{if(e.target.files[0])loadManualFile(e.target.files[0],'ships')});
  document.querySelectorAll('.tw-g').forEach(b=>b.onclick=()=>{S.tw.gid=b.dataset.g;S.tw.zoneSel=null;render()});
  document.querySelectorAll('.tw-v').forEach(b=>b.onclick=()=>{S.tw.view=b.dataset.v;render()});
  document.querySelectorAll('.twz').forEach(b=>b.onclick=()=>{S.tw.zoneSel=S.tw.zoneSel===b.dataset.z?null:b.dataset.z;render()});
  on('twAddGo','click',()=>addGuild($('twAdd').value));
  on('twAdd','keydown',e=>{if(e.key==='Enter')addGuild(e.target.value)});
  on('twReload','click',()=>loadGuild(S.tw.gid,true));
  on('twPasteGo','click',()=>useGuildText($('twPaste').value,S.tw.gid));
  on('twManual','click',()=>{S.tw.manual=!S.tw.manual;render()});
  on('twFile','change',e=>{if(e.target.files[0])loadGuildFile(e.target.files[0],S.tw.gid)});
  const twSet=(k,v)=>{S.tw.opts[k]=v;lsSet('swgoh_tw_opts',S.tw.opts);render()};
  on('twStrat','change',e=>twSet('strat',e.target.value));
  on('twRelic','change',e=>twSet('relic',+e.target.value));
  on('twPer','change',e=>twSet('perMember',Math.max(1,+e.target.value||1)));
  on('twSlots','change',e=>twSet('slots',Math.max(1,+e.target.value||1)));
  on('twFSlots','change',e=>twSet('fleetSlots',Math.max(1,+e.target.value||1)));
  on('twRes','change',e=>twSet('reserve',e.target.value));
  on('twMaxT','change',e=>twSet('maxTypes',+e.target.value));
  on('twFill','change',e=>twSet('fill',e.target.checked));
  on('twQ','change',e=>{S.tw.q=e.target.value;render()});
  on('twCopy','click',()=>{const G=S.tw.guilds[S.tw.gid]; if(!G) return; const t=twCopyText(twPlan(G)); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Plan copiado: pégalo en Discord.')).catch(()=>prompt('Copia el plan:',t));});
  on('rvCode','keydown',e=>{if(e.key==='Enter')loadRival(e.target.value)});
  document.querySelectorAll('.rv-load').forEach(b=>b.onclick=()=>loadRival(b.dataset.c));
  document.querySelectorAll('.rv-del').forEach(b=>b.onclick=()=>{lsSet('swgoh_rivales',rivals().filter(r=>r.codigo!==b.dataset.c));render()});
}
document.getElementById('btnRefresh').onclick=async()=>{
  await loadDB(true);
  await Promise.all(S.acc.map((_,i)=>loadAcc(i,true).then(()=>{renderTabs();render()})));
  if(S.rival.code && S.rival.st==='ok') await loadRival(S.rival.code);
  renderTabs();render();
};

/* ======================= INICIO ======================= */
(async function init(){
  renderTabs();
  const qp=new URLSearchParams(location.search).get('rival');
  await loadDB(false);
  try{ const r=await fetch('counters.json',{cache:'no-cache'}); if(r.ok){ const j=await r.json(); if(j && typeof j==='object' && !Array.isArray(j)) S.ctrRepo=j; } }catch(e){}
  await Promise.all(S.acc.map((_,i)=>loadAcc(i,false).then(()=>{renderTabs();render()})));
  if(qp){S.sec='rival';renderTabs();loadRival(qp);}
  renderTabs();render();
})();

</script>
